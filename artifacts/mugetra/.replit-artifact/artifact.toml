kind = "web"
previewPath = "/"
title = "Mugetra"
version = "1.0.0"
id = "artifacts/mugetra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23340

[services.development]
run = "pnpm --filter @workspace/mugetra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mugetra", "run", "build" ]
serve = "static"
publicDir = "artifacts/mugetra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23340"
BASE_PATH = "/"
