name: Deploy Mugetra Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web
        env:
          # vite.config.ts requires PORT and BASE_PATH (Replit dev config)
          PORT: '3000'
          BASE_PATH: /mugetra-app/
          NODE_ENV: production
          # Public URL of the api-server (repo variable). Empty = the site shows a
          # "server not configured" banner instead of failing silently.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm --filter @workspace/mugetra run build

      - name: Prepare SPA fallback
        run: |
          cp artifacts/mugetra/dist/public/index.html artifacts/mugetra/dist/public/404.html
          touch artifacts/mugetra/dist/public/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/mugetra/dist/public
          publish_branch: gh-pages
