# Render Blueprint : API MUGETRA (plan gratuit) + base Neon (PostgreSQL)
# Frontend : https://trixma-ux.github.io/mugetra-app/ (GitHub Pages, VITE_API_URL)
services:
  - type: web
    name: mugetra-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # NODE_ENV=development pour l'installation : esbuild etc. sont en devDependencies
    buildCommand: NODE_ENV=development pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/db run push
    # Le schéma Drizzle est poussé vers Neon au build (DATABASE_URL disponible au build).
    # Sans --force : un changement destructif fait échouer le build au lieu de perdre des données.
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      # Chaîne de connexion Neon, ex. postgresql://USER:PASSWORD@ep-xxx.eu-central-1.aws.neon.tech/mugetra?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://trixma-ux.github.io
      # ATTENTION : pas de disque persistant sur le plan gratuit.
      # Les fichiers envoyés dans uploads/ (documents) sont perdus à chaque
      # redéploiement ou redémarrage de l'instance. Voir docs/DEPLOIEMENT_RENDER.md.
